<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DAY 1｜和 AI 合作，讓 LINE 聽懂客人：AI 協作三招、整理自己的 FAQ、請 Codex 部署 LINE FAQ 機器人">
  <title>DAY 1｜AI 協作與 LINE 關鍵字機器人</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">Vibe Coding<span>DAY 1 AI 協作 × LINE</span></div>
      <a href="../course/" class="header-instructor-btn" style="display:inline-flex;align-items:center;text-decoration:none;border-radius:999px;padding:6px 12px;background:#f5e4e7;color:#76506c;font-size:12px;font-weight:700;margin-left:auto;" title="兩日課程總覽">兩日課程入口</a>
      <a href="../" class="header-instructor-btn" style="display:inline-flex;align-items:center;text-decoration:none;border-radius:999px;padding:6px 12px;background:var(--c-accent-light);color:var(--c-accent);font-size:12px;font-weight:700;margin-left:0;" title="第二天 Vibe Coding 預約系統">DAY 2｜預約系統</a>
      <div class="header-progress" id="progressText" style="margin-left:0;">0 / 0 完成</div>
    </div>
  </header>

  <nav class="tab-nav">
    <div class="tab-nav-inner" id="tabNav"></div>
  </nav>

  <main class="main-content" id="mainContent"></main>

  <script src="data.js?v=20261022-01"></script>
  <script>
    (function () {
      const nav = document.getElementById('tabNav');
      const main = document.getElementById('mainContent');
      // 與第二天共用輸入欄位（LINE 憑證、Gemini 金鑰、FAQ），同一台電腦第二天會自動帶入
      const INPUTS_KEY = 'vibe-course-inputs';
      const PROGRESS_KEY = 'vibe-day1-progress';

      // Build tabs
      STAGES.forEach((stage, i) => {
        const btn = document.createElement('button');
        btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
        btn.dataset.target = stage.id;
        btn.innerHTML = `<span class="tab-num">${i + 1}</span>${stage.label}`;
        btn.addEventListener('click', () => switchTab(stage.id));
        nav.appendChild(btn);
      });

      // Build panels
      STAGES.forEach((stage, i) => {
        const panel = document.createElement('div');
        panel.className = 'tab-panel' + (i === 0 ? ' active' : '');
        panel.id = `panel-${stage.id}`;
        panel.innerHTML = renderStage(stage);
        main.appendChild(panel);
      });

      function switchTab(id) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.target === id));
        document.querySelectorAll('.tab-panel').forEach(p => {
          p.classList.remove('active');
          if (p.id === `panel-${id}`) {
            void p.offsetWidth;
            p.classList.add('active');
          }
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function renderStage(stage) {
        let html = `
      <div class="stage-header">
        <div class="stage-badge ${stage.color}">${stage.label}</div>
        <h1 class="stage-title">${stage.title}</h1>
        <p class="stage-desc">${stage.desc}</p>
      </div>
      <div class="step-list">
    `;
        stage.steps.forEach((step, si) => {
          html += `<div class="step-card">
        <div class="step-header">
          <div class="step-number ${stage.color}">${si + 1}</div>
          <div><div class="step-title">${step.title}</div></div>
        </div>
        <div class="step-body">
          <p>${step.body}</p>`;

          // Glossary block
          if (step.glossary) {
            html += `
          <div class="glossary-table">
            <table>
              <thead><tr><th>術語</th><th>白話翻譯</th><th>生活比喻</th></tr></thead>
              <tbody>
                <tr><td><code>關鍵字自動回覆</code></td><td>LINE 內建的固定回答</td><td>一張答案對照表，客人的字要完全對上才會回</td></tr>
                <tr><td><code>AI 聊天機器人（β）</code></td><td>LINE 內建的 AI 回答（要加購方案）</td><td>一位只會看你那本問答集、挑一題回答的店員</td></tr>
                <tr><td><code>Webhook</code></td><td>事件通知機制</td><td>門鈴。客人在 LINE 敲你，LINE 就去按你程式的門鈴</td></tr>
                <tr><td><code>API</code></td><td>系統之間溝通的窗口</td><td>餐廳的點餐窗口，照規定的方式點餐就會拿到餐點</td></tr>
                <tr><td><code>Cloudflare Worker</code></td><td>雲端小程式主機</td><td>24 小時幫你守著 LINE 門鈴的代班店員</td></tr>
                <tr><td><code>Gemini</code></td><td>Google 的 AI</td><td>機器人的大腦，負責理解客人在問什麼</td></tr>
                <tr><td><code>Codex</code></td><td>會動手操作電腦的 AI</td><td>幫你安裝、部署的工程師，你當老闆下指令</td></tr>
                <tr><td><code>部署 (Deploy)</code></td><td>發布上線</td><td>把程式從你的電腦搬到雲端，讓 LINE 找得到它</td></tr>
                <tr><td><code>金鑰 / Token / Secret</code></td><td>身分憑證</td><td>店門鑰匙，有了它就能代表你的帳號做事</td></tr>
              </tbody>
            </table>
          </div>`;
          }

          // Debug SOP block
          if (step.debugSop) {
            html += `
          <div class="info-card info-card--orange">
            <div class="info-card__title">🛠️ 遇到錯誤怎麼辦？四步驟</div>
            <div class="sop-steps">
              <div class="sop-step"><span class="sop-num">1</span><div><strong>冷靜，不要慌</strong><br>錯誤是正常的，不代表你做錯了什麼。</div></div>
              <div class="sop-step"><span class="sop-num">2</span><div><strong>截圖</strong><br>把整個畫面截下來，錯誤訊息要看得清楚。</div></div>
              <div class="sop-step"><span class="sop-num">3</span><div><strong>丟給 AI</strong><br>貼上截圖並說：「我在做（哪一步），出現這個畫面，請一步一步帶我修」。</div></div>
              <div class="sop-step"><span class="sop-num">4</span><div><strong>一次只修一個問題</strong><br>修好一個再往下，不要請 AI 整個重做。</div></div>
            </div>
            <div class="info-card__footer">⭐ 你不需要看懂錯誤訊息，但要懂得請 AI 幫你看。</div>
          </div>`;
          }

          // FAQ template selector
          if (step.templateSelector) {
            html += `
          <div class="template-selector">
            <div class="template-selector__label">看別人怎麼寫（點擊後自動填入下方欄位，再改成你自己的）：</div>
            <div class="template-btns">
              ${Object.entries(FAQ_TEMPLATES).map(([key, tpl]) =>
                `<button class="template-btn" onclick="applyTemplate('${key}', this)">${tpl.label}</button>`).join('')}
            </div>
          </div>`;
          }

          // Image
          if (step.image) {
            html += `
          <div class="step-image-container" style="margin: 16px 0; border: 1px solid var(--c-border); border-radius: var(--radius); overflow: hidden; max-width: 100%;">
            <img src="${step.image}" alt="${step.title}" loading="lazy" style="width: 100%; height: auto; display: block; object-fit: contain;">
          </div>
        `;
          }

          // Flow diagram
          if (step.flow) {
            html += '<div class="flow-diagram">';
            step.flow.forEach((node, ni) => {
              html += `<span class="flow-node">${node}</span>`;
              if (ni < step.flow.length - 1) html += '<span class="flow-arrow">&rarr;</span>';
            });
            html += '</div>';
          }

          // Checklist
          if (step.checklist) {
            html += '<ul class="checklist">';
            step.checklist.forEach((item, ci) => {
              const uid = `d1-${stage.id}-${si}-${ci}`;
              html += `<li><input type="checkbox" id="${uid}" onchange="updateProgress()"><label for="${uid}">${item}</label></li>`;
            });
            html += '</ul>';
          }

          // Extra text
          if (step.extra) {
            html += `<p style="margin-top:8px;font-size:13px;color:var(--c-text-muted)">${step.extra}</p>`;
          }

          // Result box
          if (step.result) {
            html += `<div class="result-box">${step.result}</div>`;
          }

          // Tip box
          if (step.tip) {
            html += `<div class="tip-box">${step.tip}</div>`;
          }

          // Worksheet
          if (step.worksheet) {
            html += renderWorksheet(step.worksheet, `${stage.id}-${si}`);
          }

          // Prompt box（text 為固定提示詞，沒有 text 的由 updateDynamicOutputs 動態產生）
          if (step.promptBox) {
            html += `
          <div class="prompt-output-box">
            <div class="prompt-output-header">
              <span>AI 提示詞</span>
              <button class="copy-btn" id="btn-copy-${step.promptBox.id}" onclick="copyToClipboard('${step.promptBox.id}')">${step.promptBox.buttonText}</button>
            </div>
            <textarea id="${step.promptBox.id}" readonly class="prompt-textarea" placeholder="填寫完前述欄位後，此處將自動產生提示詞...">${step.promptBox.text || ''}</textarea>
          </div>
        `;
          }

          html += '</div></div>';
        });
        html += '</div>';
        return html;
      }

      function renderWorksheet(ws, prefix) {
        let html = `<div class="worksheet">
      <div class="worksheet-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        ${ws.title}
      </div>
      <div class="ws-grid">`;
        ws.fields.forEach((f, fi) => {
          const fid = f.id || `ws-${prefix}-${fi}`;
          if (f.type === 'textarea') {
            html += `</div><div class="ws-field"><label for="${fid}">${f.label}</label>
          <textarea id="${fid}" placeholder="${f.hint || ''}"></textarea>
          ${f.hint ? `<div class="ws-hint">${f.hint}</div>` : ''}</div><div class="ws-grid">`;
          } else {
            html += `<div class="ws-field"><label for="${fid}">${f.label}</label>
          <input type="text" id="${fid}" placeholder="${f.hint || ''}">
          ${f.hint ? `<div class="ws-hint">${f.hint}</div>` : ''}</div>`;
          }
        });
        html += '</div>';

        if (ws.hasCopyOutput) {
          html += `
        <div class="copy-output-box">
          <div class="copy-output-header">
            <span>LINE 憑證複製區</span>
            <button class="copy-btn" onclick="copyToClipboard('${ws.copyTargetId}')">一鍵複製</button>
          </div>
          <textarea id="${ws.copyTargetId}" readonly class="copy-textarea" placeholder="在此處填寫上方欄位後，會自動產生方便複製的格式..."></textarea>
        </div>
      `;
        }

        html += '</div>';
        return html;
      }

      // Apply FAQ example
      window.applyTemplate = function (type, btn) {
        const tpl = FAQ_TEMPLATES[type];
        if (!tpl) return;
        document.getElementById('my_theme').value = tpl.theme;
        document.getElementById('my_info').value = tpl.info;
        document.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        saveAllInputs();
        updateDynamicOutputs();
      };

      // Save all input fields（合併寫入，保留第二天頁面的欄位）
      function saveAllInputs() {
        let data = {};
        try { data = JSON.parse(localStorage.getItem(INPUTS_KEY) || '{}'); } catch (e) { }
        document.querySelectorAll('input[type="text"], textarea').forEach(el => {
          if (el.id && !el.readOnly) data[el.id] = el.value;
        });
        try { localStorage.setItem(INPUTS_KEY, JSON.stringify(data)); } catch (e) { }
      }

      // Restore all input fields
      function restoreAllInputs() {
        try {
          const saved = JSON.parse(localStorage.getItem(INPUTS_KEY) || '{}');
          Object.entries(saved).forEach(([id, val]) => {
            const el = document.getElementById(id);
            if (el && !el.readOnly) el.value = val;
          });
        } catch (e) { }
      }

      // Dynamic Prompt & Credentials updates
      // 憑證只存在學員自己瀏覽器的 localStorage，本頁不會送出到任何伺服器
      function updateDynamicOutputs() {
        const val = id => document.getElementById(id)?.value.trim() || '';
        const channelId = val('line_channel_id');
        const channelSecret = val('line_channel_secret');
        const accessToken = val('line_access_token');
        const adminUid = val('line_admin_uid');
        const geminiKey = val('gemini_api_key');

        // Credentials Area
        const credsArea = document.getElementById('line_credentials_copy');
        if (credsArea) {
          credsArea.value = `Channel ID: ${channelId}\nChannel Secret: ${channelSecret}\nAdmin User ID: ${adminUid}\nAccess Token: ${accessToken}`;
        }

        // FAQ 整理提示詞
        const faqPrompt = document.getElementById('faq_ai_prompt');
        if (faqPrompt) {
          faqPrompt.value = `我要做一個 LINE 官方帳號的自動客服，請幫我整理 FAQ。

【我的服務】
${val('my_theme') || '[請先在上方填寫你的服務]'}

【我知道的資料】
${val('my_info') || '[請先在上方填寫你確定的資料]'}

【請你完成】
1. 整理成至少 5 題 FAQ，每題的格式：
   Q：客人最可能的問法
   （其他問法：另外兩種客人可能的說法）
   A：答案
2. 最後列出「客人可能還會問、但我沒有給資料」的問題

【限制】
- 只能使用我提供的資料
- 「還沒確定」或沒有資料的答案，一律寫：請傳「人工」，由真人為您回覆
- 不要編造價格、日期、地址或優惠`;
        }

        // DAY 1 部署提示詞
        const buildPrompt = document.getElementById('day1_build_prompt');
        if (buildPrompt) {
          buildPrompt.value = `你是我的 LINE 機器人工程師。請從零開始，幫我做一個「LINE AI 客服」並部署上線。
我是零基礎學員，請先用三句白話說明你的計畫，再一步一步做，每一步做完用一句白話告訴我結果。

【這個機器人要做什麼】
客人在 LINE 傳任何文字，機器人把客人的問題連同【我的 FAQ】一起交給 Google Gemini，請它理解意思後，只依照 FAQ 回答。
客人不會照 FAQ 的原句問，例如 FAQ 寫「營業時間」，客人可能問「你們幾點開門？」，都要答得出來。

【我的 FAQ】
${val('my_faq') || '[請回「我的 FAQ」分頁貼上確認好的 FAQ]'}

【LINE 與 Gemini 憑證】
- LINE_CHANNEL_SECRET: ${channelSecret || '[請回「LINE 官方帳號」分頁填寫 Channel Secret]'}
- LINE_CHANNEL_ACCESS_TOKEN: ${accessToken || '[請回「LINE 官方帳號」分頁填寫 Access Token]'}
- GEMINI_API_KEY: ${geminiKey || '[請在上方填寫 Gemini API Key]'}

【憑證保存規則】
- 憑證只能用 npx wrangler secret put 設定到 Cloudflare，或放在本機的 .dev.vars。
- 不要把它們寫進任何程式碼、wrangler 設定檔或 README，也不要 commit 到 GitHub。

【技術規格】
1. 在我的電腦建立一個新資料夾 line-ai-faq，用 Cloudflare Workers（JavaScript）。不需要資料庫，不要建立 D1 或 R2。
2. FAQ 放在一個獨立的檔案，之後我要改 FAQ 只改這個檔案。
3. GET /health 回傳 {"status":"ok"}，讓我確認有上線。
4. POST /webhook/line 接收 LINE 訊息：
   - 用 LINE_CHANNEL_SECRET 驗證 x-line-signature，驗證失敗回 401。
   - LINE 按 Verify 時送來的 events 是空的，也要回 200。
   - 先回 200 給 LINE，再在背景呼叫 Gemini 和回覆（用 ctx.waitUntil），避免逾時。
   - 只處理文字訊息，用 replyToken 回覆。
5. 客人傳「人工」：回覆「已通知真人客服，請稍候」，不呼叫 Gemini。
6. 其他文字：呼叫 Gemini（模型 gemini-2.5-flash），規則：
   - 用繁體中文，簡短親切，像店家在 LINE 回覆客人。
   - 只能使用 FAQ 的內容，不能編造價格、日期、地址、優惠。
   - FAQ 沒有的，回答：這個我需要確認，請傳「人工」，由真人為您回覆。
   - Gemini 出錯時，也回覆上面這句，不要讓客人收不到回應。

【部署步驟】
7. 確認 npx wrangler whoami 已登入 Cloudflare，沒有的話執行 npx wrangler login。
8. 用 npx wrangler secret put 設定上面三個憑證。
9. 部署，完成後告訴我 Worker 網址。
10. 打開「Worker 網址/health」，確認看到 "status":"ok"。
11. 告訴我要貼到 LINE Developers 的 Webhook URL：「Worker 網址/webhook/line」。

【遇到錯誤時】
先用白話說明發生什麼事，再告訴我你打算怎麼修，一次只修一個問題，不要整個專案重寫。`;
        }
      }

      // Copy to Clipboard with Visual Feedback
      window.copyToClipboard = function (id) {
        const el = document.getElementById(id);
        if (!el) return;
        el.select();
        el.setSelectionRange(0, 99999);
        try {
          navigator.clipboard.writeText(el.value).then(() => {
            const btn = document.getElementById(`btn-copy-${id}`) || document.querySelector(`button[onclick*="${id}"]`);
            if (btn) {
              const originalText = btn.textContent;
              btn.textContent = '已複製！';
              btn.style.background = 'var(--c-success)';
              btn.style.color = '#fff';
              setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = '';
                btn.style.color = '';
              }, 1500);
            }
          });
        } catch (err) {
          alert('複製失敗，請手動選取複製！');
        }
      };

      // Listen for input events
      document.body.addEventListener('input', (e) => {
        if (e.target.matches('input, textarea')) {
          saveAllInputs();
          updateDynamicOutputs();
        }
      });

      // Progress tracking
      window.updateProgress = function () {
        const all = document.querySelectorAll('.checklist input[type="checkbox"]');
        const checked = document.querySelectorAll('.checklist input[type="checkbox"]:checked');
        document.getElementById('progressText').textContent = `${checked.length} / ${all.length} 完成`;
        const state = {};
        all.forEach(cb => { state[cb.id] = cb.checked; });
        try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(state)); } catch (e) { }
      };

      // Restore state
      restoreAllInputs();
      updateDynamicOutputs();

      try {
        const saved = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');
        Object.entries(saved).forEach(([id, checked]) => {
          const cb = document.getElementById(id);
          if (cb) cb.checked = checked;
        });
      } catch (e) { }
      window.updateProgress();

    })();
  </script>

</body>

</html>
